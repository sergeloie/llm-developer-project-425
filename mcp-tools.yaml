- name: create-ticket
  description: "Создать тикет обращения в системе поддержки"
  input_json_schema: '{"type":"object","properties":{"user_id":{"type":"string","description":"ID пользователя"},"category":{"type":"string","enum":["bug","docs","feature","access"],"description":"Категория обращения"},"text":{"type":"string","description":"Текст обращения"}},"required":["user_id","category","text"],"additionalProperties":false}'
  action:
    function_call:
      function_id: ydb-tickets
      tag: $latest

- name: list-my-tickets
  description: "Показать список тикетов пользователя"
  input_json_schema: '{"type":"object","properties":{"user_id":{"type":"string","description":"ID пользователя"}},"required":["user_id"],"additionalProperties":false}'
  action:
    function_call:
      function_id: ydb-tickets
      tag: $latest

- name: append-message
  description: "Добавить сообщение в историю диалога по тикету"
  input_json_schema: '{"type":"object","properties":{"ticket_id":{"type":"string","description":"ID тикета"},"text":{"type":"string","description":"Текст сообщения"},"role":{"type":"string","enum":["user","agent"],"description":"Роль автора сообщения"}},"required":["ticket_id","text","role"],"additionalProperties":false}'
  action:
    function_call:
      function_id: ydb-tickets
      tag: $latest
